# src/main/resources/application.properties

# Spring Boot app-ын нэр (log дээр харагддаг)
spring.application.name=api

# PostgreSQL database-тэй холбогдох URL
# localhost:5432 дээр ажиллаж буй "fintech_api" нэртэй database-руу холбогдоно
spring.datasource.url=jdbc:postgresql://localhost:5432/fintech_api

# Database-д нэвтрэх хэрэглэгчийн нэр
spring.datasource.username=fintech_user

# Тухайн хэрэглэгчийн нууц үг
spring.datasource.password=fintech123

# Hibernate (JPA ORM) Entity классуудаас автоматаар database table үүсгэх/шинэчлэх горим
# "update" = байхгүй table үүсгэнэ, шинэ багана нэмнэ, өгөгдлийг устгахгүй (dev-д тохиромжтой)
# Production дээр "validate" эсвэл migration tool (Flyway/Liquibase) ашиглах нь зөв
spring.jpa.hibernate.ddl-auto=update

# Hibernate-ийн үүсгэж буй бодит SQL query-г console дээр хэвлэнэ (debug-д хэрэгтэй)
spring.jpa.show-sql=true

# PostgreSQL-ийн SQL dialect-ыг тодорхой зааж өгнө
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect